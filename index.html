<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>學習羅盤 LearnCompass</title>
  <meta name="description" content="線上課程統計與學習提醒">
  <meta name="theme-color" content="#fbf6ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="學習羅盤">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- 密碼鎖 -->
  <div id="lock" class="lock" hidden>
    <div class="lock-card">
      <svg class="logo big" aria-hidden="true"><use href="#logo"/></svg>
      <h1>學習羅盤</h1>
      <p class="lock-hint" id="lock-hint">輸入密碼解鎖</p>
      <div class="pin-dots" id="pin-dots" aria-hidden="true"></div>
      <div class="keypad" id="keypad">
        <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
        <button type="button" class="key-text" id="lock-forgot">忘記？</button><button type="button" data-key="0">0</button>
        <button type="button" class="key-text" data-key="back" aria-label="刪除一位"><svg class="i"><use href="#i-back"/></svg></button>
      </div>
    </div>
  </div>

  <!-- 登入 -->
  <div id="login" class="login" hidden>
    <div class="login-card">
      <svg class="logo big" aria-hidden="true"><use href="#logo"/></svg>
      <h1>學習羅盤</h1>
      <p class="en">LearnCompass</p>
      <p>登入 Google 帳號，手機和電腦就會同步同一份課程資料。</p>
      <button class="btn primary wide" id="btn-login" type="button">使用 Google 登入</button>
      <p class="login-error" id="login-error"></p>
    </div>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">
        <svg class="logo" aria-hidden="true"><use href="#logo"/></svg>
        <div><strong>學習羅盤</strong><span>LearnCompass</span></div>
      </div>
      <nav class="tabs" aria-label="主選單">
        <button type="button" data-tab="courses" class="active"><svg class="i"><use href="#i-grid"/></svg><span>課程</span></button>
        <button type="button" data-tab="alerts"><svg class="i"><use href="#i-bell"/></svg><span>提醒</span><b class="count" id="alert-count" hidden></b></button>
        <button type="button" data-tab="stats"><svg class="i"><use href="#i-chart"/></svg><span>統計</span></button>
        <button type="button" data-tab="settings"><svg class="i"><use href="#i-gear"/></svg><span>設定</span></button>
      </nav>
      <div class="top-actions">
        <button class="btn icon-only quiet" type="button" data-action="lock-now" id="btn-lock" title="立即上鎖" aria-label="立即上鎖" hidden><svg class="i"><use href="#i-lock"/></svg></button>
        <button class="btn primary" type="button" data-action="new"><svg class="i"><use href="#i-plus"/></svg><span>新增課程</span></button>
      </div>
    </header>

    <main>
      <section class="hero" id="hero"></section>

      <section id="view-courses" class="view">
        <div class="toolbar">
          <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="q" type="search" placeholder="搜尋課程、老師或平台…" autocomplete="off"></label>
          <div class="filters">
            <select id="f-category" aria-label="分類"></select>
            <select id="f-status" aria-label="狀態">
              <option value="">全部狀態</option>
              <option value="notStarted">未開始</option>
              <option value="inProgress">學習中</option>
              <option value="done">已完成</option>
              <option value="expired">已過期</option>
            </select>
            <select id="f-sort" aria-label="排序">
              <option value="purchaseDesc">最新購入</option>
              <option value="purchaseAsc">最早購入</option>
              <option value="expiry">即將到期</option>
              <option value="priceDesc">金額高到低</option>
              <option value="energyAsc">能量低到高</option>
              <option value="energyDesc">能量高到低</option>
            </select>
          </div>
        </div>
        <p class="result-count" id="result-count"></p>
        <div class="grid" id="grid"></div>
      </section>

      <section id="view-alerts" class="view" hidden></section>
      <section id="view-stats" class="view" hidden></section>
      <section id="view-settings" class="view" hidden></section>
    </main>
  </div>

  <dialog id="editor">
    <form method="dialog" id="editor-form">
      <header class="dlg-head">
        <h2 id="editor-title">新增課程</h2>
        <button type="button" class="btn quiet icon-only" data-close aria-label="關閉"><svg class="i"><use href="#i-x"/></svg></button>
      </header>
      <div class="dlg-body">
        <label class="field full">課程名稱<input name="name" required></label>
        <label class="field">老師<input name="teacher" list="dl-teacher"></label>
        <label class="field">課程分類<input name="category" list="dl-category"></label>
        <label class="field">上課平台<input name="platform" list="dl-platform"></label>
        <label class="field">購入金額（NT$）<input name="price" type="number" min="0" step="1" inputmode="numeric"></label>
        <label class="field">購買日期<input name="purchaseDate" type="date"></label>
        <label class="field">觀看權限到期日<small>沒有期限請留空</small><input name="accessUntil" type="date"></label>
        <label class="field full">學習能量 <output id="energy-out">0%</output><input name="energy" type="range" min="0" max="100" step="1"></label>
        <label class="field full">快速傳送門（課程網址）<input name="link" type="url" inputmode="url" placeholder="https://"></label>
        <div class="field full">
          <span>上課場次（直播、實體課）</span>
          <div id="sessions" class="sessions"></div>
          <button type="button" class="btn ghost small" id="btn-add-session"><svg class="i"><use href="#i-plus"/></svg>新增場次</button>
        </div>
        <label class="field full">備註<textarea name="note" rows="4"></textarea></label>
      </div>
      <footer class="dlg-foot">
        <button type="button" class="btn ghost" data-close>取消</button>
        <button type="submit" class="btn primary" value="save">儲存</button>
      </footer>
    </form>
  </dialog>

  <dialog id="pin-dialog" class="small-dialog">
    <form method="dialog" id="pin-form">
      <header class="dlg-head">
        <h2 id="pin-title">設定密碼</h2>
        <button type="button" class="btn quiet icon-only" data-close aria-label="關閉"><svg class="i"><use href="#i-x"/></svg></button>
      </header>
      <div class="dlg-body one">
        <p class="muted-text" id="pin-desc">密碼只存在這台裝置，用來防止別人打開 APP 看到你的課程。</p>
        <label class="field" id="pin-current-field">目前的密碼<input name="current" type="password" inputmode="numeric" autocomplete="off" pattern="\d{4,6}" maxlength="6"></label>
        <label class="field" id="pin-new-field">新密碼（4～6 位數字）<input name="pin" type="password" inputmode="numeric" autocomplete="new-password" pattern="\d{4,6}" maxlength="6"></label>
        <label class="field" id="pin-confirm-field">再輸入一次<input name="confirm" type="password" inputmode="numeric" autocomplete="new-password" pattern="\d{4,6}" maxlength="6"></label>
        <p class="form-error" id="pin-error"></p>
      </div>
      <footer class="dlg-foot">
        <button type="button" class="btn ghost" data-close>取消</button>
        <button type="submit" class="btn primary" id="pin-submit">確定</button>
      </footer>
    </form>
  </dialog>

  <datalist id="dl-teacher"></datalist>
  <datalist id="dl-category"></datalist>
  <datalist id="dl-platform"></datalist>
  <input type="file" id="file-import" accept=".csv,.json,text/csv,application/json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="logo-bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffb37a"/><stop offset="1" stop-color="#e8684f"/>
      </linearGradient>
      <symbol id="logo" viewBox="0 0 64 64">
        <rect width="64" height="64" rx="18" fill="url(#logo-bg)"/>
        <circle cx="32" cy="32" r="21" fill="none" stroke="#fff8ef" stroke-width="3.5" opacity=".9"/>
        <path d="M32 9v5M32 50v5M9 32h5M50 32h5" stroke="#fff8ef" stroke-width="3" stroke-linecap="round" opacity=".9"/>
        <path d="M32 16 38 32H26Z" fill="#fff8ef"/>
        <path d="M32 48 26 32h12Z" fill="#2b2622" opacity=".55"/>
        <circle cx="32" cy="32" r="3.5" fill="#2b2622"/>
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
      <symbol id="i-coins" viewBox="0 0 24 24"><circle cx="9" cy="9" r="6"/><path d="M18.1 10.4A6 6 0 1 1 10.4 18.1M7 7h2v4"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18M7 16v-5M12 16V8M17 16v-8"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1ZM17 9l-6 6M11 9l6 6"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 22l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
    </defs>
  </svg>
</body>
</html>
